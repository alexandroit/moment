<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>@revivejs/moment — Docs</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="0; url=v2.30.5/">
  <style>
    :root {
      color-scheme: light;
      --text: #102033;
      --muted: #59708a;
      --surface: rgba(255,255,255,0.9);
      --border: rgba(191,206,223,0.8);
      --shadow: 0 24px 60px rgba(23, 50, 77, 0.12);
      --accent: #c15d3f;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1rem;
      font-family: "Avenir Next", "Helvetica Neue", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top right, rgba(254,228,179,0.5), transparent 32%),
        radial-gradient(circle at left 18%, rgba(170,219,255,0.4), transparent 28%),
        linear-gradient(180deg, #fff9f0 0%, #f5fbff 55%, #eef4fb 100%);
    }

    .card {
      width: min(760px, 100%);
      padding: 1.5rem;
      border: 1px solid var(--border);
      border-radius: 24px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    h1 {
      margin: 0 0 0.75rem;
      font-family: Georgia, "Times New Roman", serif;
      letter-spacing: -0.02em;
    }

    p {
      margin: 0 0 1rem;
      color: var(--muted);
      line-height: 1.6;
    }

    .versions {
      display: grid;
      gap: 0.75rem;
      margin: 1rem 0;
    }

    .ver {
      display: flex;
      justify-content: space-between;
      gap: 0.75rem;
      padding: 0.9rem 1rem;
      border-radius: 16px;
      text-decoration: none;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.8);
      color: var(--text);
    }

    .ver.latest {
      border-color: transparent;
      background: linear-gradient(135deg, var(--accent), #9e4a31);
      color: #fff;
    }

    .ver span {
      font-weight: 700;
    }

    .note {
      margin-top: 0.75rem;
      font-size: 0.92rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>@revivejs/moment</h1>
    <p>Select a published package version to view the matching docs build:</p>
    <div class="versions">
      <a class="ver latest" href="v2.30.5/">Moment 2.30.5 <span>(latest)</span></a>
      <a class="ver other" href="v2.30.4/">Moment 2.30.4</a>
      <a class="ver other" href="v2.30.3/">Moment 2.30.3</a>
      <a class="ver other" href="v2.30.2/">Moment 2.30.2</a>
    </div>
    <p class="note">Redirecting to the latest version…</p>
  </div>
</body>
</html>
